<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Головна панель вкладок</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="theme-dark">
  <div class="dashboard-wrapper">
    <!-- Верхня панель: Годинник, Вітання, Пошук, Тема -->
    <header class="dashboard-header">
      <div class="header-left">
        <div class="greeting-badge" id="greeting-badge">Доброго дня</div>
        <div class="clock-box">
          <span class="clock-time" id="clock-time">00:00:00</span>
          <span class="clock-date" id="clock-date">Завантаження дати...</span>
        </div>
      </div>

      <div class="header-center">
        <form class="search-form" id="search-form" autocomplete="off">
          <div class="search-input-wrapper">
            <svg class="icon search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Пошук у Google або введіть URL (натисніть / для фокусу)..."
              aria-label="Пошук у Google або адреса"
            />
            <kbd class="search-shortcut">/</kbd>
          </div>
        </form>
      </div>

      <div class="header-right">
        <button class="control-btn" id="theme-toggle" aria-label="Перемкнути тему" title="Змінити тему оформлення">
          <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </div>
    </header>

    <!-- Верхній блок віджетів: Мапа тривог (Alerts.in.ua) + Віджет погоди -->
    <div class="hero-widgets-row">
      <!-- ГОЛОВНИЙ ВІДЖЕТ: MAPA.UA (Карта тривог) -->
      <section class="alerts-hero-section">
        <div class="alerts-card">
          <div class="alerts-card-header">
            <div class="alerts-title-group">
              <span class="live-pulse-beacon" title="Оновлюється наживо"></span>
              <span class="live-label">НАЖИВО</span>
              <h3>Карта повітряних тривог України</h3>
              <span class="alerts-badge">mapa.ua</span>
            </div>
            <div class="alerts-header-actions">
              <button class="expand-btn" id="open-alerts-btn" title="Відкрити карту на весь екран у новій вкладці" aria-label="Відкрити карту у новій вкладці">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                  <polyline points="15 3 21 3 21 9"></polyline>
                  <line x1="10" y1="14" x2="21" y2="3"></line>
                </svg>
                <span>Відкрити</span>
              </button>
            </div>
          </div>
          <div class="alerts-frame-container">
            <iframe
              src="https://mapa.ua/embed"
              class="alerts-iframe"
              width="100%"
              height="480"
              loading="lazy"
              allowfullscreen
              title="Карта повітряних тривог України — MAPA.UA"
            ></iframe>
          </div>
        </div>
      </section>

      <!-- ВІДЖЕТ ПОГОДИ: Погода у Черкасах (Конфігурація 236px) -->
      <aside class="weather-sidebar-section">
        <div class="sidebar-card weather-card">
          <div class="sidebar-card-header">
            <div class="sidebar-title-group">
              <svg class="icon weather-header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"></path>
              </svg>
              <h3>Погода</h3>
            </div>
            <button class="expand-btn-sm" id="open-weather-btn" title="Відкрити прогноз погоди у новій вкладці" aria-label="Відкрити погоду">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
                <polyline points="15 3 21 3 21 9"></polyline>
                <line x1="10" y1="14" x2="21" y2="3"></line>
              </svg>
            </button>
          </div>

          <div class="weather-widget-wrapper">
            <!-- Вбудований віджет погоди -->
            <div id="weatherandtime-widget-pe5jan4vxbj">
              <a href="https://weatherandtime.net/uk/weather/cherkasy-35348" target="_blank" rel="noopener noreferrer">Черкаси</a>
            </div>
          </div>

          <div class="weather-card-footer">
            <a href="https://weatherandtime.net/uk/weather/cherkasy-35348" target="_blank" rel="noopener noreferrer" class="weather-source-link">
              WeatherAndTime &rarr;
            </a>
          </div>
        </div>
      </aside>
    </div>

    <!-- СЕКЦІЯ: Закріплені сайти (швидкі плашки на всю ширину) -->
    <section class="quick-links-section">
      <div class="section-title-bar">
        <div class="section-title-left">
          <h2>Закріплені сайти</h2>
          <span class="plates-count" id="plates-count">6 сайтів</span>
        </div>
        <span class="info-tip">
          <svg class="icon tip-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          Клікніть на плашку для відкриття у новій вкладці
        </span>
      </div>

      <div class="plates-grid" id="plates-grid" role="region" aria-label="Швидкі закладки сайтів">
        <!-- Плашки генеруються динамічно через app.js -->
      </div>
    </section>

    <!-- Підвал -->
    <footer class="dashboard-footer">
      <span>Головна панель &bull; Автоматичне відкриття у новій вкладці</span>
    </footer>
  </div>

  <!-- Скрипт завантаження віджета погоди (weatherandtime.net) -->
  <script>
    (function() {
      const widgetUrl = encodeURIComponent(location.href);
      async function fetchWidgetData() {
        try {
          let WUrl = 'https://weatherandtime.net/api/template?&cityId=35348&id=daily13&color=2D2581&langId=29&width=236&iconPack=grd_fill&rand_id=t8bd6m9quz';
          WUrl += '&ref=' + widgetUrl;
          let response = await fetch(WUrl);
          if (!response.ok) {
            throw new Error(`HTTP error! Status: ${response.status}`);
          }
          const data = await response.json();
          if (data && data.patternHTML) {
            const container = document.getElementById("weatherandtime-widget-pe5jan4vxbj");
            if (container) {
              container.innerHTML = data.patternHTML;
            }
          }
        } catch (err) {
          console.warn('Помилка завантаження віджета погоди:', err);
        }
      }
      fetchWidgetData();
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
